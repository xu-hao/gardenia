  <title id="gardenia-title">gardenia rosette mark</title>
  <desc id="gardenia-description">A symmetrical eight-petal pinwheel gardenia rosette inside an open-cornered square garden border, in solid black on white.</desc>
  <rect width="512" height="512" fill="#ffffff"/>
  <!-- Open-cornered square garden border (edges at 52 and 460, open corner gaps of 56 units). -->
